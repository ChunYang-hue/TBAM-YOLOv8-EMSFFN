# Reference template for TBAM-YOLOv8-EMSFFN
# Based on YOLOv8n, modified with TBAM and EMSFFN.
# For exact reproduction, use the original training code.

nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 1, TBAM, [1024]]          # 10: TBAM at end of backbone

head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]            # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]            # 16: M3 80x80

  # Extra shallow branch: M3 + C2 -> M2 160x160
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]            # 19: M2 160x160

  # Extra shallow branch: M2 + C1 -> M1 320x320
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 0], 1, Concat, [1]]
  - [-1, 3, C2f, [64]]             # 22: M1 320x320

  # PAN bottom-up
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]            # 25: P2 160x160

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]            # 28: P3 80x80

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]            # 31: P4 40x40

  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]           # 34: P5 20x20

  # TBAM before each prediction head
  - [25, 1, TBAM, [128]]           # 35
  - [28, 1, TBAM, [256]]           # 36
  - [31, 1, TBAM, [512]]           # 37
  - [34, 1, TBAM, [1024]]          # 38

  # Four detection heads
  - [[35, 36, 37, 38], 1, Detect, [nc]]  # 39
